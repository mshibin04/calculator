<html>
  <head>
    <title>Calculator App</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: Arial, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .main {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 380px;
      }

      h2 {
        text-align: center;
        color: #333;
        margin-top: 0;
      }

      .input-area {
        margin-bottom: 15px;
      }

      .input-area label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
        font-size: 13px;
      }

      .input-area input {
        width: 100%;
        padding: 9px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .input-area input:focus {
        border-color: #667eea;
        outline: none;
      }

      .ops-section {
        margin-top: 20px;
        margin-bottom: 15px;
      }

      .ops-section label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #555;
        font-size: 13px;
      }

      .btn-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn {
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        transition: transform 0.1s;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-plus {
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .btn-minus {
        background: linear-gradient(135deg, #f093fb, #f5576c);
      }

      .btn-times {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
      }

      .btn-divide {
        background: linear-gradient(135deg, #43e97b, #38f9d7);
      }

      .result-area {
        margin-top: 20px;
        margin-bottom: 15px;
      }

      .result-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .result-box {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 5px;
        text-align: right;
        font-size: 22px;
        font-weight: bold;
        color: #333;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .result-box.empty {
        color: #aaa;
        font-size: 13px;
        justify-content: center;
      }

      .error-text {
        color: #d32f2f;
        font-size: 12px;
        margin-top: 8px;
        text-align: center;
        display: none;
      }

      .error-text.show {
        display: block;
      }

      .clear-btn {
        width: 100%;
        padding: 9px;
        background: #e0e0e0;
        color: #333;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
      }

      .clear-btn:hover {
        background: #d0d0d0;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <h2>Calculator</h2>

      <div class="input-area">
        <label>First Number:</label>
        <input type="number" id="num1" step="any" placeholder="Enter number" />
      </div>

      <div class="input-area">
        <label>Second Number:</label>
        <input type="number" id="num2" step="any" placeholder="Enter number" />
      </div>

      <div class="ops-section">
        <label>Operation:</label>
        <div class="btn-container">
          <button class="btn btn-plus" onclick="doCalc('+')">+</button>
          <button class="btn btn-minus" onclick="doCalc('-')">-</button>
          <button class="btn btn-times" onclick="doCalc('*')">*</button>
          <button class="btn btn-divide" onclick="doCalc('/')">÷</button>
        </div>
      </div>

      <div class="result-area">
        <div class="result-label">Result:</div>
        <div class="result-box empty" id="resultBox">Ready</div>
      </div>

      <div class="error-text" id="errorBox"></div>

      <button class="clear-btn" onclick="resetForm()">Clear</button>
    </div>

    <script>
      async function doCalc(op) {
        const n1 = document.getElementById("num1").value;
        const n2 = document.getElementById("num2").value;
        const resultBox = document.getElementById("resultBox");
        const errorBox = document.getElementById("errorBox");

        errorBox.classList.remove("show");
        errorBox.textContent = "";

        if (!n1 || !n2) {
          errorBox.textContent = "Please enter both numbers";
          errorBox.classList.add("show");
          return;
        }

        try {
          const response = await fetch(
            window.location.origin + "/api/calculate",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                number1: parseFloat(n1),
                number2: parseFloat(n2),
                operation: op,
              }),
            },
          );

          const data = await response.json();

          if (response.ok) {
            resultBox.textContent = data.result;
            resultBox.classList.remove("empty");
          } else {
            errorBox.textContent = data.error || "Error";
            errorBox.classList.add("show");
            resultBox.textContent = "Error";
            resultBox.classList.add("empty");
          }
        } catch (err) {
          errorBox.textContent = "Connection error";
          errorBox.classList.add("show");
        }
      }

      function resetForm() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("resultBox").textContent = "Ready";
        document.getElementById("resultBox").classList.add("empty");
        document.getElementById("errorBox").classList.remove("show");
      }
    </script>
  </body>
</html>
