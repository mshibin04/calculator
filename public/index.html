<html>
  <head>
    <title>My Calculator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
      }

      h1 {
        text-align: center;
        color: #333;
        margin-top: 5px;
        margin-bottom: 20px;
        font-size: 24px;
      }

      .input-field {
        margin-bottom: 12px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        color: #444;
        font-size: 13px;
      }

      input {
        width: 100%;
        padding: 8px;
        border: 2px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
      }

      input:focus {
        border: 2px solid #667eea;
        outline: none;
      }

      .buttons-section {
        margin-top: 18px;
        margin-bottom: 15px;
      }

      .buttons-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: #333;
      }

      .calc-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: bold;
        color: white;
        cursor: pointer;
      }

      .btn-add {
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      .btn-sub {
        background: linear-gradient(135deg, #f093fb, #f5576c);
      }

      .btn-mul {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
      }

      .btn-div {
        background: linear-gradient(135deg, #43e97b, #38f9d7);
      }

      button:hover {
        opacity: 0.9;
      }

      .result-section {
        margin: 15px 0;
      }

      .result-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
        font-weight: bold;
      }

      .result-display {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 4px;
        text-align: right;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        min-height: 35px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .result-display.waiting {
        color: #999;
        font-size: 12px;
        justify-content: center;
      }

      .error-msg {
        color: #d32f2f;
        font-size: 11px;
        margin-top: 8px;
        text-align: center;
        display: none;
      }

      .error-msg.active {
        display: block;
      }

      .reset-button {
        width: 100%;
        padding: 8px;
        background: #ddd;
        color: #333;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        font-size: 13px;
      }

      .reset-button:hover {
        background: #ccc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Calculator</h1>

      <div class="input-field">
        <label>Number 1:</label>
        <input type="number" id="input1" step="any" />
      </div>

      <div class="input-field">
        <label>Number 2:</label>
        <input type="number" id="input2" step="any" />
      </div>

      <div class="buttons-section">
        <label>Choose Operation:</label>
        <div class="calc-buttons">
          <button class="btn-add" onclick="calculate('+')">+</button>
          <button class="btn-sub" onclick="calculate('-')">-</button>
          <button class="btn-mul" onclick="calculate('*')">*</button>
          <button class="btn-div" onclick="calculate('/')">÷</button>
        </div>
      </div>

      <div class="result-section">
        <div class="result-label">Answer:</div>
        <div class="result-display waiting" id="answer">Ready</div>
      </div>

      <div class="error-msg" id="errormsg"></div>

      <button class="reset-button" onclick="clear_calc()">Clear</button>
    </div>

    <script>
      function calculate(symbol) {
        let val1 = document.getElementById("input1").value;
        let val2 = document.getElementById("input2").value;
        let answerbox = document.getElementById("answer");
        let errorbox = document.getElementById("errormsg");

        errorbox.classList.remove("active");
        errorbox.textContent = "";

        if (!val1 || !val2) {
          errorbox.textContent = "Please enter both numbers";
          errorbox.classList.add("active");
          return;
        }

        let num1 = parseFloat(val1);
        let num2 = parseFloat(val2);
        let res = 0;

        if (symbol == "+") {
          res = num1 + num2;
        } else if (symbol == "-") {
          res = num1 - num2;
        } else if (symbol == "*") {
          res = num1 * num2;
        } else if (symbol == "/") {
          if (num2 == 0) {
            errorbox.textContent = "Can't divide by zero";
            errorbox.classList.add("active");
            return;
          }
          res = num1 / num2;
        }

        answerbox.textContent = res;
        answerbox.classList.remove("waiting");
      }

      function clear_calc() {
        document.getElementById("input1").value = "";
        document.getElementById("input2").value = "";
        document.getElementById("answer").textContent = "Ready";
        document.getElementById("answer").classList.add("waiting");
        document.getElementById("errormsg").classList.remove("active");
      }
    </script>
  </body>
</html>
