<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .calculator {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      width: 280px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px;
      cursor: pointer;
    }
    #result {
      text-align: center;
      font-weight: bold;
      min-height: 20px;
    }
    #error {
      color: red;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h1>Calculator</h1>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <div class="buttons">
      <button onclick="calculate('+')">+</button>
      <button onclick="calculate('-')">-</button>
      <button onclick="calculate('*')">*</button>
      <button onclick="calculate('/')">/</button>
    </div>

    <p id="result"></p>
    <p id="error"></p>
  </div>

  <script>
    function calculate(op) {
      var n1 = document.getElementById("num1").value;
      var n2 = document.getElementById("num2").value;
      var errorBox = document.getElementById("error");
      var resultBox = document.getElementById("result");

      errorBox.textContent = "";
      resultBox.textContent = "";

      if (n1 === "" || n2 === "") {
        errorBox.textContent = "Please enter both numbers.";
        return;
      }

      n1 = parseFloat(n1);
      n2 = parseFloat(n2);
      var answer;

      if (op === "+") {
        answer = n1 + n2;
      } else if (op === "-") {
        answer = n1 - n2;
      } else if (op === "*") {
        answer = n1 * n2;
      } else if (op === "/") {
        if (n2 === 0) {
          errorBox.textContent = "Can't divide by zero.";
          return;
        }
        answer = n1 / n2;
      }

      resultBox.textContent = "ANSWER IS: " + answer;
    }
  </script>

</body>
</html>
